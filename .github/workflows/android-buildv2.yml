
name: Build JeKahf Multi Tech APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP if needed
        run: |
          mkdir -p _build_src
          for f in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
            unzip -oq "$f" -d _build_src
          done

      - name: Find Android Gradle project
        run: |
          GRADLEW=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            echo "Pastikan ZIP berisi proyek Android Studio."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeKahf-Multi-Tech-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
